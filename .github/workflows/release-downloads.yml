name: Attach portable downloads
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
permissions: {}
jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: attach-downloads-${{ github.event.release.tag_name || inputs.tag }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the release tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Attach the archives from the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets')
          for name in Mcbe2Friends-Windows-x64.zip Mcbe2Friends-macOS.zip Mcbe2Friends-Linux-x64.tar.gz Mcbe2Friends-Linux-ARM64.tar.gz
          do
            file="downloads/$name"
            actual="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            existing=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' <<< "$assets")
            if [[ -z "$existing" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            elif [[ "$existing" != "$actual" ]]; then
              echo "An attachment with a different digest already exists for $name." >&2
              exit 1
            fi
          done
