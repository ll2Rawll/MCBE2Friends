name: Minecraft hosting
on:
  workflow_dispatch:
  push:
    paths:
      - "hosting*.go"
      - "install.go"
      - "catalog/java.json"
      - "packaging/java-lifetime/**"
      - "background*.go"
      - "startup*.go"
      - "session_windows.go"
      - "broadcast.go"
      - "main.go"
      - "os_*.go"
      - "go.mod"
      - "go.sum"
      - "licensing/**"
      - "testdata/hosting-attestation.json"
      - ".github/workflows/hosting.yml"
permissions:
  contents: read
jobs:
  real-server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Test the launcher and file management
        id: unit
        run: go test ./...
      - name: Restore from an unattended Windows scheduled task
        if: runner.os == 'Windows'
        env:
          MCBE2FRIENDS_TEST_BOOT_TASK: "1"
        run: go test -v -count=1 -timeout 5m -run TestWindowsScheduledResume .
      - name: Start and restart the official native Bedrock server
        if: runner.os != 'macOS' && runner.arch == 'X64'
        env:
          MCBE2FRIENDS_TEST_BEDROCK: "1"
        shell: bash
        run: |
          go test -v -count=1 -timeout 7m -run TestOfficialBedrockLifecycle . 2>&1 | tee "$RUNNER_TEMP/bedrock-test.log" || {
            detail=$(grep -m 1 -E 'hosting_live_test.go:[0-9]+:' "$RUNNER_TEMP/bedrock-test.log" || true)
            echo "::error::Bedrock integration failed. $detail"
            exit 1
          }
      - name: Start Vanilla and Paper, switch Geyser on and off, and restore a world
        if: ${{ !cancelled() && steps.unit.conclusion == 'success' }}
        env:
          MCBE2FRIENDS_TEST_JAVA: "1"
        shell: bash
        run: |
          go test -v -count=1 -timeout 18m -run TestOfficialJavaLifecycle . 2>&1 | tee "$RUNNER_TEMP/java-test.log" || {
            detail=$(grep -m 1 -E 'hosting_java_live_test.go:[0-9]+:.*(error|unreachable|failed|could not)' "$RUNNER_TEMP/java-test.log" || true)
            echo "::error::Java integration failed. $detail"
            exit 1
          }
      - name: Host Fabric across the Java 17, 21 and 25 generations and install Modrinth dependencies
        if: ${{ !cancelled() && steps.unit.conclusion == 'success' }}
        env:
          MCBE2FRIENDS_TEST_FABRIC: "1"
        run: go test -v -count=1 -timeout 15m -run TestOfficialFabric .
      - name: Restore legacy Paper dimensions and check cross-play through ViaVersion
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          MCBE2FRIENDS_TEST_ARCHIVED_PAPER: "1"
        run: go test -v -count=1 -timeout 12m -run TestOfficialArchivedPaper .
