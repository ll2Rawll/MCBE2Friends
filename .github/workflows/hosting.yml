name: Native Bedrock hosting
on:
  workflow_dispatch:
  push:
    paths:
      - "hosting*.go"
      - "background*.go"
      - "startup*.go"
      - "session_windows.go"
      - "broadcast.go"
      - "main.go"
      - "os_*.go"
      - "go.mod"
      - "go.sum"
      - "licensing/**"
      - "testdata/hosting-attestation.json"
      - ".github/workflows/hosting.yml"
permissions:
  contents: read
jobs:
  real-server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Test the launcher and file management
        run: go test ./...
      - name: Restore from an unattended Windows scheduled task
        if: runner.os == 'Windows'
        env:
          MCBE2FRIENDS_TEST_BOOT_TASK: "1"
        run: go test -v -count=1 -timeout 5m -run TestWindowsScheduledResume .
      - name: Start and restart the official native Bedrock server
        if: runner.os != 'macOS'
        env:
          MCBE2FRIENDS_TEST_BEDROCK: "1"
        run: go test -v -count=1 -timeout 7m -run TestOfficialBedrockLifecycle .
