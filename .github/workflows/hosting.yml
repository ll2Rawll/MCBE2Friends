name: Native Bedrock hosting
on:
  workflow_dispatch:
  push:
    paths:
      - "hosting*.go"
      - ".github/workflows/hosting.yml"
permissions:
  contents: read
jobs:
  real-server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Test the launcher and file management
        run: go test ./...
      - name: Start and restart the official native Bedrock server
        env:
          MCBE2FRIENDS_TEST_BEDROCK: "1"
        run: go test -v -count=1 -timeout 7m -run TestOfficialBedrockLifecycle .
