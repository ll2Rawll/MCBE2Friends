name: Desktop windows
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop*.go"
      - "desktopwindow/**"
      - "web/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "packaging/build.py"
      - "packaging/check-desktop.ps1"
      - "packaging/launcher.manifest"
      - "resource_windows_amd64.syso"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, name: windows-amd64}
          - {os: ubuntu-24.04, name: linux-amd64}
          - {os: ubuntu-24.04-arm, name: linux-arm64}
          - {os: macos-15, name: darwin-arm64}
          - {os: macos-15-intel, name: darwin-amd64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.4"
      - name: Install the Linux desktop build and test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11
      - name: Install the Microsoft desktop runtime if needed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Microsoft runtime signature check failed' }
            Start-Process -FilePath $installer -ArgumentList '/silent','/install' -Wait
          }
      - name: Exercise the controls inside the native webview
        shell: bash
        env:
          MCBE2FRIENDS_TEST_DESKTOP: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- go test -tags desktop,production,webkit2_41 -run '^TestNativeDesktopWindow$' -count=1 -v .
          else
            go test -tags desktop,production -run '^TestNativeDesktopWindow$' -count=1 -v .
          fi
      - name: Build the shipping desktop executable
        run: python packaging/build.py --native-output native
      - name: Double-click, close and reopen the shipping Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/check-desktop.ps1 -Binary native/windows-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.name }}
          path: native/${{ matrix.name }}
          if-no-files-found: error
